version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped

  # MySQL（可选，生产环境使用）
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rag_password
      MYSQL_DATABASE: rag_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    profiles:
      - production

volumes:
  mysql_data:
